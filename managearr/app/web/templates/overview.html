{% extends "base.html" %}
{% block title %}Overview{% endblock %}
{% block content %}
<h1>Overview</h1>
<section class="card-grid" id="overview-cards">
  <div class="card">
    <h2>Status</h2>
    <p class="metric" id="ov-status">-</p>
  </div>
  <div class="card">
    <h2>Database</h2>
    <p class="metric" id="ov-db">-</p>
  </div>
  <div class="card">
    <h2>Libraries configured</h2>
    <p class="metric" id="ov-configured">-</p>
  </div>
  <div class="card">
    <h2>Libraries enabled</h2>
    <p class="metric" id="ov-enabled">-</p>
  </div>
</section>
<section class="card">
  <h2>Automation policy</h2>
  <p id="ov-policy-summary">Loading...</p>
</section>
{% endblock %}
{% block scripts %}
<script>
async function loadOverview() {
  const status = await api('/api/v1/status');
  setText('ov-status', status.status);
  setText('ov-db', status.database.connected ? 'connected' : 'unavailable');
  setText('ov-configured', status.libraries.configured);
  setText('ov-enabled', status.libraries.enabled);

  const policy = await api('/api/v1/policy');
  setText('ov-policy-summary', policy.summary);
}
loadOverview().catch(err => toast('Failed to load overview: ' + err.message));
</script>
{% endblock %}
